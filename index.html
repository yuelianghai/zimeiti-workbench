<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7256EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="创作工作台">
<title>✨ 自媒体个人工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="app">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🦄</div>
      <div class="brand-text">
        <div class="brand-title">创作工作台</div>
        <div class="brand-sub">一个人也是一支队伍</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="streak-mini" id="streakMini">🔥 连续创作 0 天</div>
      <button class="btn-ghost tiny" id="btnBackup">💾 备份 / 恢复</button>
    </div>
  </aside>

  <div class="mask" id="mask"></div>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="菜单">☰</button>
      <div class="topbar-title" id="pageTitle">首页</div>
      <div class="topbar-right">
        <span class="chip" id="dataChip">📡 数据加载中</span>
        <button class="icon-btn" id="btnRefresh" title="刷新今日数据">🔄</button>
      </div>
    </header>

    <div class="view" id="view"></div>

    <footer class="foot">
      <span>数据全部存在你自己的手机/电脑里 · 不上传任何服务器</span>
    </footer>
  </main>

  <!-- 移动端底部快捷栏 -->
  <nav class="tabbar only-mobile" id="tabbar"></nav>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <span id="modalTitle">标题</span>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/store.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/views.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
